name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: |
          pip install -e ".[dev]"
          # av2's own declared deps pull in torch + the full NVIDIA CUDA
          # toolkit + kornia + numba + polars (~7GB) — none of it used by
          # the two av2 modules this project imports. --no-deps here,
          # with the real deps listed explicitly in pyproject.toml,
          # keeps this step from running the runner out of disk.
          pip install --no-deps av2==0.3.6

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest -q
