[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmap-watch"
version = "0.1.0"
description = "LiDAR-based HD map change detection and validation pipeline: detects stale or incorrect lane-level features by comparing map geometry and topology against LiDAR observations, then ranks suspicious features for human review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "pandas",
    "pyarrow",
    "av2",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "matplotlib",
    "moto[s3]",
]

[project.scripts]
hdmap-watch = "hdmap_watch.etl.run_etl:main"

[tool.setuptools.packages.find]
include = ["hdmap_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
