[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hdmap-watch"
version = "0.1.0"
description = "LiDAR-based HD map change detection and validation pipeline: detects stale or incorrect lane-level features by comparing map geometry and topology against LiDAR observations, then ranks suspicious features for human review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
    "pandas",
    "pyarrow",
    "boto3",
    # av2 itself is installed separately with --no-deps (see README /
    # CI) — its declared dependencies unconditionally include torch +
    # the full NVIDIA CUDA toolkit + kornia + numba + polars (~7GB),
    # none of which the modules this project actually imports
    # (av2.geometry.geometry, av2.map.map_api) touch. These five are
    # the real, verified import-time dependencies of those two modules.
    "matplotlib",
    "opencv-python-headless",
    "pillow",
    "universal-pathlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "jupyter",
    "moto[s3]",
]

[project.scripts]
hdmap-watch = "hdmap_watch.etl.run_etl:main"

[tool.setuptools.packages.find]
include = ["hdmap_watch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
